name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.13
      - name: Install pinned Buf
        run: |
          mkdir -p "$HOME/.local/bin"
          GOBIN="$HOME/.local/bin" go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Local-equivalent CI gate
        run: make ci

  infrastructure-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run Compose integration
        run: make integration
