[package]
name = "cerbero-detection-runtime"
description = "CERBERO MVP durable analytical runtime boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cerbero-common = { path = "../cerbero-common" }
prost = "=0.14.4"
prost-types = "=0.14.4"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync"] }
tokio-postgres = "=0.7.18"
uuid = { version = "=1.18.1", features = ["v7"] }
cerbero-detection-core = { path = "../cerbero-detection-core" }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }

[lints]
workspace = true
