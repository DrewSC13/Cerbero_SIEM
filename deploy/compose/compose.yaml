name: cerbero

services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../../migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine@sha256:8f1dd1ec7213410276c8e9aee11b25b458fe9d53eee13ad8cfdf7c79e36aad17
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?copy .env.example to .env first}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?copy .env.example to .env first}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?copy .env.example to .env first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../../migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nats:
    image: nats:2.14@sha256:d4a8980c1ee558257f196f86693ec919c7a8b8095dd678e2cb5ff1adcfe03ecb
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    environment:
      NATS_ADMIN_USER: ${NATS_ADMIN_USER:?copy .env.example to .env first}
      NATS_ADMIN_PASSWORD: ${NATS_ADMIN_PASSWORD:?copy .env.example to .env first}
      NATS_INGEST_USER: ${NATS_INGEST_USER:?copy .env.example to .env first}
      NATS_INGEST_PASSWORD: ${NATS_INGEST_PASSWORD:?copy .env.example to .env first}
      NATS_RAW_PRESERVER_USER: ${NATS_RAW_PRESERVER_USER:?copy .env.example to .env first}
      NATS_RAW_PRESERVER_PASSWORD: ${NATS_RAW_PRESERVER_PASSWORD:?copy .env.example to .env first}
      NATS_NORMALIZER_USER: ${NATS_NORMALIZER_USER:?copy .env.example to .env first}
      NATS_NORMALIZER_PASSWORD: ${NATS_NORMALIZER_PASSWORD:?copy .env.example to .env first}
      NATS_WORKER_USER: ${NATS_WORKER_USER:?copy .env.example to .env first}
      NATS_WORKER_PASSWORD: ${NATS_WORKER_PASSWORD:?copy .env.example to .env first}
      NATS_DETECTION_USER: ${NATS_DETECTION_USER:?copy .env.example to .env first}
      NATS_DETECTION_PASSWORD: ${NATS_DETECTION_PASSWORD:?copy .env.example to .env first}
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data/jetstream
      - ../../configs/nats/nats-server.conf:/etc/nats/nats-server.conf:ro

  nats-bootstrap:
    image: natsio/nats-box:0.19.7@sha256:ffce8bd103383f179f8c7f11cf645726acf5d17280706c530c3b342dbe16334c
    profiles: ["bootstrap"]
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222
      NATS_ADMIN_USER: ${NATS_ADMIN_USER:?copy .env.example to .env first}
      NATS_ADMIN_PASSWORD: ${NATS_ADMIN_PASSWORD:?copy .env.example to .env first}
    volumes:
      - ../../scripts/dev/nats-bootstrap.sh:/usr/local/bin/cerbero-nats-bootstrap:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/cerbero-nats-bootstrap"]

  cerbero-ingest:
    profiles: ["app"]
    image: cerbero/ingest:${CERBERO_APP_IMAGE_TAG:-step34}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.go-service
      args:
        GO_BUILD_IMAGE: ${CERBERO_GO_BUILD_IMAGE:?CERBERO_GO_BUILD_IMAGE is required}
        CERBERO_GO_PACKAGE: ./services/cerbero-ingest
    depends_on:
      - nats
    environment:
      CERBERO_SECURITY_PROFILE: DEVELOPMENT
      CERBERO_INGEST_INSECURE_DEVELOPMENT: "1"
      CERBERO_INGEST_CONTAINER_DEVELOPMENT: "1"
      CERBERO_INGEST_LISTEN_ADDRESS: 0.0.0.0:19080
      CERBERO_INGEST_HTTP_PATH: ${CERBERO_INGEST_HTTP_PATH}
      CERBERO_INGEST_MAX_PAYLOAD_SIZE: ${CERBERO_INGEST_MAX_PAYLOAD_SIZE}
      CERBERO_INGEST_MAX_CONNECTION_RATE: ${CERBERO_INGEST_MAX_CONNECTION_RATE}
      CERBERO_INGEST_MAX_EVENTS_PER_SECOND: ${CERBERO_INGEST_MAX_EVENTS_PER_SECOND}
      CERBERO_INGEST_READ_TIMEOUT: ${CERBERO_INGEST_READ_TIMEOUT}
      CERBERO_INGEST_IDLE_TIMEOUT: ${CERBERO_INGEST_IDLE_TIMEOUT}
      CERBERO_INGEST_CONCURRENT_CONNECTIONS: ${CERBERO_INGEST_CONCURRENT_CONNECTIONS}
      CERBERO_INGEST_SHUTDOWN_TIMEOUT: ${CERBERO_INGEST_SHUTDOWN_TIMEOUT}
      CERBERO_INGEST_COMPONENT_VERSION: ${CERBERO_INGEST_COMPONENT_VERSION}
      CERBERO_INGEST_PIPELINE_VERSION: ${CERBERO_INGEST_PIPELINE_VERSION}
      CERBERO_INGEST_INSTANCE_ID: ${CERBERO_INGEST_INSTANCE_ID}
      CERBERO_NATS_URL: nats://nats:4222
      NATS_INGEST_USER: ${NATS_INGEST_USER}
      NATS_INGEST_PASSWORD: ${NATS_INGEST_PASSWORD}
      CERBERO_INGEST_DEV_TENANT_ID: ${CERBERO_INGEST_DEV_TENANT_ID}
      CERBERO_INGEST_DEV_SOURCE_ID: ${CERBERO_INGEST_DEV_SOURCE_ID}
      CERBERO_INGEST_DEV_SENSOR_ID: ${CERBERO_INGEST_DEV_SENSOR_ID}
      CERBERO_INGEST_DEV_REMOTE_IDENTITY: ${CERBERO_INGEST_DEV_REMOTE_IDENTITY}
    ports:
      - "127.0.0.1:${CERBERO_INGEST_HOST_PORT:-19080}:19080"

  cerbero-syslog:
    profiles: ["app"]
    image: cerbero/syslog:${CERBERO_APP_IMAGE_TAG:-step34}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.go-service
      args:
        GO_BUILD_IMAGE: ${CERBERO_GO_BUILD_IMAGE:?CERBERO_GO_BUILD_IMAGE is required}
        CERBERO_GO_PACKAGE: ./services/cerbero-ingest/cmd/cerbero-syslog
    depends_on:
      - nats
    environment:
      CERBERO_SECURITY_PROFILE: DEVELOPMENT
      CERBERO_INGEST_INSECURE_DEVELOPMENT: "1"
      CERBERO_SYSLOG_CONTAINER_DEVELOPMENT: "1"
      CERBERO_SYSLOG_LISTEN_ADDRESS: 0.0.0.0:5514
      CERBERO_INGEST_MAX_PAYLOAD_SIZE: ${CERBERO_INGEST_MAX_PAYLOAD_SIZE}
      CERBERO_INGEST_MAX_CONNECTION_RATE: ${CERBERO_INGEST_MAX_CONNECTION_RATE}
      CERBERO_INGEST_MAX_EVENTS_PER_SECOND: ${CERBERO_INGEST_MAX_EVENTS_PER_SECOND}
      CERBERO_INGEST_CONCURRENT_CONNECTIONS: ${CERBERO_INGEST_CONCURRENT_CONNECTIONS}
      CERBERO_INGEST_READ_TIMEOUT: ${CERBERO_INGEST_READ_TIMEOUT}
      CERBERO_INGEST_COMPONENT_VERSION: ${CERBERO_INGEST_COMPONENT_VERSION}
      CERBERO_INGEST_PIPELINE_VERSION: ${CERBERO_INGEST_PIPELINE_VERSION}
      CERBERO_SYSLOG_INSTANCE_ID: ${CERBERO_SYSLOG_INSTANCE_ID}
      CERBERO_SYSLOG_DEV_TENANT_ID: ${CERBERO_SYSLOG_DEV_TENANT_ID}
      CERBERO_SYSLOG_DEV_SOURCE_ID: ${CERBERO_SYSLOG_DEV_SOURCE_ID}
      CERBERO_SYSLOG_DEV_SENSOR_ID: ${CERBERO_SYSLOG_DEV_SENSOR_ID}
      CERBERO_SYSLOG_DEV_REMOTE_IDENTITY: ${CERBERO_SYSLOG_DEV_REMOTE_IDENTITY}
      CERBERO_NATS_URL: nats://nats:4222
      NATS_INGEST_USER: ${NATS_INGEST_USER}
      NATS_INGEST_PASSWORD: ${NATS_INGEST_PASSWORD}
    ports:
      - "127.0.0.1:${CERBERO_SYSLOG_HOST_PORT:-19514}:5514"

  cerbero-raw-preserver:
    profiles: ["app"]
    image: cerbero/raw-preserver:${CERBERO_APP_IMAGE_TAG:-step34}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.go-service
      args:
        GO_BUILD_IMAGE: ${CERBERO_GO_BUILD_IMAGE:?CERBERO_GO_BUILD_IMAGE is required}
        CERBERO_GO_PACKAGE: ./services/cerbero-raw-preserver
    depends_on:
      - postgres
      - nats
    environment:
      CERBERO_DEV_MODE: "1"
      CERBERO_SECURITY_PROFILE: DEVELOPMENT
      CERBERO_NATS_URL: nats://nats:4222
      NATS_RAW_PRESERVER_USER: ${NATS_RAW_PRESERVER_USER}
      NATS_RAW_PRESERVER_PASSWORD: ${NATS_RAW_PRESERVER_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_RAW_PRESERVER_USER: ${POSTGRES_RAW_PRESERVER_USER}
      POSTGRES_RAW_PRESERVER_PASSWORD: ${POSTGRES_RAW_PRESERVER_PASSWORD}
      CERBERO_RAW_STORE_PATH: /var/lib/cerbero/raw
      CERBERO_RAW_PRESERVER_COMPONENT_VERSION: ${CERBERO_RAW_PRESERVER_COMPONENT_VERSION}
      CERBERO_RAW_PRESERVER_INSTANCE_ID: ${CERBERO_RAW_PRESERVER_INSTANCE_ID}
      CERBERO_RAW_PRESERVER_CONNECT_TIMEOUT: ${CERBERO_RAW_PRESERVER_CONNECT_TIMEOUT}
      CERBERO_RAW_PRESERVER_RETRY_MIN_DELAY: ${CERBERO_RAW_PRESERVER_RETRY_MIN_DELAY}
      CERBERO_RAW_PRESERVER_RETRY_MAX_DELAY: ${CERBERO_RAW_PRESERVER_RETRY_MAX_DELAY}
    volumes:
      - raw-store:/var/lib/cerbero/raw

  cerbero-normalizer:
    profiles: ["app"]
    image: cerbero/normalizer:${CERBERO_APP_IMAGE_TAG:-step34}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.normalizer
      args:
        RUST_BUILD_IMAGE: ${CERBERO_RUST_BUILD_IMAGE:?CERBERO_RUST_BUILD_IMAGE is required}
        DEBIAN_RUNTIME_IMAGE: ${CERBERO_DEBIAN_RUNTIME_IMAGE:?CERBERO_DEBIAN_RUNTIME_IMAGE is required}
    depends_on:
      - postgres
      - clickhouse
      - nats
      - cerbero-raw-preserver
    environment:
      CERBERO_DEV_MODE: "1"
      CERBERO_SECURITY_PROFILE: DEVELOPMENT
      CERBERO_NATS_URL: nats://nats:4222
      NATS_NORMALIZER_USER: ${NATS_NORMALIZER_USER}
      NATS_NORMALIZER_PASSWORD: ${NATS_NORMALIZER_PASSWORD}
      CERBERO_NORMALIZER_COMPONENT_VERSION: ${CERBERO_NORMALIZER_COMPONENT_VERSION}
      CERBERO_NORMALIZER_INSTANCE_ID: ${CERBERO_NORMALIZER_INSTANCE_ID}
      CERBERO_NORMALIZER_PIPELINE_VERSION: ${CERBERO_NORMALIZER_PIPELINE_VERSION}
      CERBERO_NORMALIZER_EXECUTION_MODE: LIVE
      CERBERO_NORMALIZER_REPLAY_INPUT: HISTORICAL
      CERBERO_NORMALIZER_LINUX_SSHD_PARSER_VERSION: ${CERBERO_NORMALIZER_LINUX_SSHD_PARSER_VERSION}
      CERBERO_NORMALIZER_SOURCE_TIME_OFFSETS: ${CERBERO_NORMALIZER_SOURCE_TIME_OFFSETS}
      CERBERO_NORMALIZER_RETRY_MIN_SECONDS: ${CERBERO_NORMALIZER_RETRY_MIN_SECONDS}
      CERBERO_NORMALIZER_RETRY_MAX_SECONDS: ${CERBERO_NORMALIZER_RETRY_MAX_SECONDS}
      CERBERO_NORMALIZER_RETRY_BUDGET: ${CERBERO_NORMALIZER_RETRY_BUDGET}
      CERBERO_RAW_STORE_PATH: /var/lib/cerbero/raw
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_NORMALIZER_USER: ${CLICKHOUSE_NORMALIZER_USER}
      CLICKHOUSE_NORMALIZER_PASSWORD: ${CLICKHOUSE_NORMALIZER_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_NORMALIZER_USER: ${POSTGRES_NORMALIZER_USER}
      POSTGRES_NORMALIZER_PASSWORD: ${POSTGRES_NORMALIZER_PASSWORD}
    volumes:
      - raw-store:/var/lib/cerbero/raw:ro

  cerbero-worker:
    profiles: ["app"]
    image: cerbero/worker:${CERBERO_APP_IMAGE_TAG:-step34}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.go-service
      args:
        GO_BUILD_IMAGE: ${CERBERO_GO_BUILD_IMAGE:?CERBERO_GO_BUILD_IMAGE is required}
        CERBERO_GO_PACKAGE: ./services/cerbero-worker
    depends_on:
      - postgres
      - nats
    environment:
      CERBERO_DEV_MODE: "1"
      CERBERO_SECURITY_PROFILE: DEVELOPMENT
      CERBERO_NATS_URL: nats://nats:4222
      NATS_WORKER_USER: ${NATS_WORKER_USER}
      NATS_WORKER_PASSWORD: ${NATS_WORKER_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD}
      CERBERO_WORKER_COMPONENT_VERSION: ${CERBERO_WORKER_COMPONENT_VERSION}
      CERBERO_WORKER_INSTANCE_ID: ${CERBERO_WORKER_INSTANCE_ID}
      CERBERO_WORKER_CONNECT_TIMEOUT: ${CERBERO_WORKER_CONNECT_TIMEOUT}
      CERBERO_WORKER_REPLAY_MAX_AUTOMATIC_ATTEMPTS: ${CERBERO_WORKER_REPLAY_MAX_AUTOMATIC_ATTEMPTS}
      CERBERO_WORKER_REPLAY_NAK_DELAY: ${CERBERO_WORKER_REPLAY_NAK_DELAY}

  cerbero-api:
    profiles: ["app"]
    image: cerbero/api:${CERBERO_APP_IMAGE_TAG:-step34}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.go-service
      args:
        GO_BUILD_IMAGE: ${CERBERO_GO_BUILD_IMAGE:?CERBERO_GO_BUILD_IMAGE is required}
        CERBERO_GO_PACKAGE: ./services/cerbero-api
    depends_on:
      - postgres
      - clickhouse
    environment:
      CERBERO_SECURITY_PROFILE: DEVELOPMENT
      CERBERO_API_LISTEN_ADDRESS: 0.0.0.0:19081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_API_USER: ${POSTGRES_API_USER}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_API_USER: ${CLICKHOUSE_API_USER}
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD}
    ports:
      - "127.0.0.1:${CERBERO_API_HOST_PORT:-19081}:19081"

volumes:
  postgres-data:
  clickhouse-data:
  nats-data:
  raw-store:
