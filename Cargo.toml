[workspace]
resolver = "3"
members = [
    "crates/cerbero-agent",
    "crates/cerbero-common",
    "crates/cerbero-detection-core",
    "crates/cerbero-integrity",
    "crates/cerbero-normalizer",
    "crates/cerbero-tui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
