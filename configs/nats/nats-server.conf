server_name: "cerbero-dev"
listen: "0.0.0.0:4222"
http: "0.0.0.0:8222"
max_payload: 8MB

jetstream {
  store_dir: "/data/jetstream"
  max_mem: 256MB
  max_file: 4GB
}

authorization {
  users = [
    {
      user: $NATS_ADMIN_USER
      password: $NATS_ADMIN_PASSWORD
      permissions: {
        publish: ">"
        subscribe: ">"
      }
    },
    {
      user: $NATS_INGEST_USER
      password: $NATS_INGEST_PASSWORD
      permissions: {
        publish: ["cerbero.v1.raw.received", "cerbero.v1.system.>", "$JS.API.STREAM.INFO.CERBERO_RAW"]
        subscribe: "_INBOX.>"
      }
    },
    {
      user: $NATS_RAW_PRESERVER_USER
      password: $NATS_RAW_PRESERVER_PASSWORD
      permissions: {
        publish: [
          "cerbero.v1.raw.persisted",
          "cerbero.v1.system.>",
          "cerbero.v1.dlq.raw",
          "$JS.API.CONSUMER.CREATE.CERBERO_RAW.raw-preserver",
          "$JS.API.CONSUMER.CREATE.CERBERO_RAW.raw-preserver.>",
          "$JS.API.CONSUMER.INFO.CERBERO_RAW.raw-preserver",
          "$JS.API.CONSUMER.MSG.NEXT.CERBERO_RAW.raw-preserver",
          "$JS.ACK.CERBERO_RAW.raw-preserver.>"
        ]
        subscribe: ["cerbero.v1.raw.received", "_INBOX.>"]
      }
    },
    {
      user: $NATS_NORMALIZER_USER
      password: $NATS_NORMALIZER_PASSWORD
      permissions: {
        publish: [
          "cerbero.v1.normalized.created",
          "cerbero.v1.system.>",
          "cerbero.v1.dlq.normalization",
          "$JS.API.STREAM.INFO.CERBERO_RAW",
          "$JS.API.CONSUMER.CREATE.CERBERO_RAW.normalizer",
          "$JS.API.CONSUMER.CREATE.CERBERO_RAW.normalizer.>",
          "$JS.API.CONSUMER.INFO.CERBERO_RAW.normalizer",
          "$JS.API.CONSUMER.MSG.NEXT.CERBERO_RAW.normalizer",
          "$JS.ACK.CERBERO_RAW.normalizer.>",
          "$JS.API.CONSUMER.CREATE.CERBERO_RAW.normalizer-replay",
          "$JS.API.CONSUMER.CREATE.CERBERO_RAW.normalizer-replay.>",
          "$JS.API.CONSUMER.INFO.CERBERO_RAW.normalizer-replay",
          "$JS.API.CONSUMER.MSG.NEXT.CERBERO_RAW.normalizer-replay",
          "$JS.API.CONSUMER.DELETE.CERBERO_RAW.normalizer-replay",
          "$JS.ACK.CERBERO_RAW.normalizer-replay.>",
          "$JS.API.CONSUMER.CREATE.CERBERO_RAW.normalizer-replay-selective",
          "$JS.API.CONSUMER.CREATE.CERBERO_RAW.normalizer-replay-selective.>",
          "$JS.API.CONSUMER.INFO.CERBERO_RAW.normalizer-replay-selective",
          "$JS.API.CONSUMER.MSG.NEXT.CERBERO_RAW.normalizer-replay-selective",
          "$JS.API.CONSUMER.DELETE.CERBERO_RAW.normalizer-replay-selective",
          "$JS.ACK.CERBERO_RAW.normalizer-replay-selective.>",
          "$JS.API.CONSUMER.CREATE.CERBERO_RAW.normalizer-test",
          "$JS.API.CONSUMER.CREATE.CERBERO_RAW.normalizer-test.>",
          "$JS.API.CONSUMER.INFO.CERBERO_RAW.normalizer-test",
          "$JS.API.CONSUMER.MSG.NEXT.CERBERO_RAW.normalizer-test",
          "$JS.API.CONSUMER.DELETE.CERBERO_RAW.normalizer-test",
          "$JS.ACK.CERBERO_RAW.normalizer-test.>"
        ]
        subscribe: ["cerbero.v1.raw.persisted", "cerbero.v1.raw.replay", "_INBOX.>"]
      }
    },
    {
      user: $NATS_WORKER_USER
      password: $NATS_WORKER_PASSWORD
      permissions: {
        publish: [
          "cerbero.v1.raw.replay",
          "$JS.API.STREAM.INFO.CERBERO_DLQ",
          "$JS.API.STREAM.INFO.CERBERO_RAW",
          "$JS.API.STREAM.MSG.GET.CERBERO_RAW",
          "$JS.API.DIRECT.GET.CERBERO_RAW",
          "$JS.API.CONSUMER.CREATE.CERBERO_DLQ.worker-normalization-dlq-replay",
          "$JS.API.CONSUMER.CREATE.CERBERO_DLQ.worker-normalization-dlq-replay.>",
          "$JS.API.CONSUMER.INFO.CERBERO_DLQ.worker-normalization-dlq-replay",
          "$JS.API.CONSUMER.MSG.NEXT.CERBERO_DLQ.worker-normalization-dlq-replay",
          "$JS.ACK.CERBERO_DLQ.worker-normalization-dlq-replay.>"
        ]
        subscribe: ["cerbero.v1.dlq.normalization", "_INBOX.>"]
      }
    },
    {
      user: $NATS_DETECTION_USER
      password: $NATS_DETECTION_PASSWORD
      permissions: {
        publish: ["cerbero.v1.signal.created", "cerbero.v1.finding.created", "cerbero.v1.system.>", "cerbero.v1.dlq.detection", "cerbero.v1.dlq.correlation"]
        subscribe: ["cerbero.v1.normalized.created", "cerbero.v1.signal.created", "_INBOX.>"]
      }
    }
  ]
}
