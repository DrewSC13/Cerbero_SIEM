syntax = "proto3";

package cerbero.contracts.v1;

import "cerbero/contracts/v1/common.proto";
import "cerbero/contracts/v1/error.proto";
import "google/protobuf/timestamp.proto";

option go_package = "cerbero/services/internal/contracts/v1;contractsv1";

// Transformation records provenance for a material processing step.
message Transformation {
  string transformation_id = 1;
  string input_object_id = 2;
  string input_object_type = 3;
  string output_object_id = 4;
  string output_object_type = 5;
  string component = 6;
  string component_version = 7;
  string configuration_hash = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  TransformationStatus status = 11;
  optional CerberoError error = 12;
  ExecutionMode execution_mode = 13;
}
